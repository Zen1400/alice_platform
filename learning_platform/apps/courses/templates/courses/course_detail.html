<!-- apps/courses/templates/courses/course_detail.html -->
{% extends 'students/base.html' %}
{% block content %}
  <h2>{{ course.title }}</h2>
  <p>{{ course.description }}</p>

  <!-- Display image if available -->
  {% if course.image %}
    <img src="{{ course.image.url }}" alt="{{ course.title }}" style="max-width:100%;">
  {% endif %}

  <!-- Display video if available -->
  {% if course.video %}
    <video controls style="max-width:100%;">
      <source src="{{ course.video.url }}" type="video/mp4">
      Your browser does not support the video tag.
    </video>
  {% endif %}

  <!-- Display rich text content -->
  <div class="course-content">
    {{ course.content|safe }}
  </div>

  <!-- Display code snippet if available -->
  {% if course.code_snippet %}
    <h3>Example Code:</h3>
    <pre style="background:#f4f4f4; padding:10px;">{{ course.code_snippet }}</pre>
  {% endif %}
{% endblock %}
