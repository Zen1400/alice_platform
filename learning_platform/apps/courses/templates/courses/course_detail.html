<!-- courses/templates/courses/course_detail.html -->
{% extends 'students/base.html' %}

{% block content %}
<h2>{{ course.title }}</h2>
<p>{{ course.description }}</p>
<p>Price: ${{ course.price }}</p>
{% if user.is_authenticated %}
    <a href="{% url 'courses:purchase_course' course.id %}" class="cta-btn">Purchase this Course</a>
{% else %}
    <p>Please <a href="{% url 'login' %}">log in</a> to purchase this course.</p>
{% endif %}
{% endblock %}
