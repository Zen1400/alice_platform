<!-- courses/templates/courses/course_list.html -->
{% extends 'students/base.html' %}

{% block content %}
<h2>All Courses</h2>
<div class="course-cards">
    {% for course in courses %}
        <div class="course-card">
            <h4>{{ course.title }}</h4>
            <p>{{ course.description|truncatewords:20 }}</p>
            <p class="course-meta">Price: ${{ course.price }}</p>
            <a href="{% url 'courses:course_detail' course.id %}" class="details-link">View Details</a>
        </div>
    {% empty %}
        <p>No courses available at the moment.</p>
    {% endfor %}
</div>
{% endblock %}
