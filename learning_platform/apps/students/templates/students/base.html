{% load static %} 
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Learning Platform</title>
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
  <!-- Header with fixed navigation bar -->
  <header>
    <div class="nav-container">
      <h1 class="logo">Learning Platform</h1>
      <nav>
        <a href="{% url 'home' %}">Home</a>
        {% if user.is_authenticated %}
          <a href="{% url 'dashboard' %}">Dashboard</a>
          <!-- Note: Using the courses namespace for the courses list -->
          <a href="{% url 'courses:course_list' %}">Courses</a>
          <span class="user-welcome">Welcome, {{ user.username }}</span>
          <form action="{% url 'logout' %}" method="post" class="logout-form">
              {% csrf_token %}
              <button type="submit">Logout</button>
          </form>
        {% else %}
          <a href="{% url 'login' %}">Login</a>
          <a href="{% url 'signup' %}">Sign Up</a>
        {% endif %}
      </nav>
    </div>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <script src="{% static 'js/script.js' %}"></script>
</body>
</html>
